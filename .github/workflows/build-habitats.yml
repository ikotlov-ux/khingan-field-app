name: Build habitats
on:
  push:
    paths: ['data/habitat_db.xlsx', 'tools/build_habitats.py']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install openpyxl
      - run: python tools/build_habitats.py data/habitat_db.xlsx habitats.js
      - name: Bump release number (only if habitats.js changed)
        run: |
          git diff --quiet habitats.js && exit 0
          python tools/bump_version.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add habitats.js sw.js app.js
          git diff --cached --quiet || git commit -m "Rebuild habitats.js from data/habitat_db.xlsx [skip ci]"
          git push
      - name: Request GitHub Pages build
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
