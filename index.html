<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1b5e20">
<title>Habitat 32</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="vendor/ol.css">
<script src="vendor/ol.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="vendor/piexif.js"></script>
<script src="vendor/qrcode.js"></script>
<style>
:root{--bg:#0d1710;--card:#17251a;--line:#2a3c2e;--green:#2e7d32;--green2:#43a047;--text:#edf5ee;--muted:#a2b5a6;--red:#b3261e;--blue:#1976d2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:12px 12px 92px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Roboto,"PingFang SC","Microsoft YaHei",Arial,sans-serif}
.hdr{display:flex;align-items:center;gap:8px;margin:2px 0 8px}.hdr img{width:46px;height:46px;border-radius:8px;flex:none;object-fit:contain}.hdr .labph{width:46px;height:46px;flex:none}.hdr .lab{flex:1;text-align:center;font-size:13px;font-weight:650;line-height:1.25}.hdr .lab small{display:block;font-size:10px;font-weight:500;color:var(--muted);margin-top:2px}
.titlerow{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 10px;position:relative}
h1{font-size:18px;margin:0;text-align:center}
.qrtop{left:0;right:auto}
.langbtn{position:absolute;right:0;top:-2px;border:1px solid #38503e;border-radius:10px;background:#0f1912;color:#fff;font-size:13px;font-weight:700;padding:6px 10px}
.footer{color:var(--muted);font-size:11px;line-height:1.4;text-align:center;padding:4px 6px 0}.footer a{color:#a2b5a6}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.mapwrap{position:relative}
#map{height:46vh;min-height:300px;max-height:460px;border-radius:11px;overflow:hidden;background:#1a2a1e}
.mapbtns{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:5}
.mapbtns .mb{width:42px;height:42px;border-radius:10px;border:1px solid #38503e;background:rgba(13,23,16,.88);color:#fff;font-size:22px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center}
.mapbtns .mb.small{font-size:11px;font-weight:650;line-height:1.15;text-align:center;height:46px;padding:0 2px}
.mapbtns .mb.active{background:var(--green)}
.basemenu{position:absolute;right:58px;top:170px;z-index:6;display:flex;flex-direction:column;gap:4px;background:rgba(13,23,16,.95);border:1px solid #38503e;border-radius:10px;padding:6px}.basemenu button{border:0;border-radius:8px;background:transparent;color:#fff;font-size:13px;padding:8px 12px;text-align:left;white-space:nowrap}.basemenu button.active{background:var(--green)}
.ol-zoom{display:none}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}
select,input{width:100%;padding:11px;border-radius:10px;border:1px solid #38503e;background:#0f1912;color:var(--text);font-size:16px}
.gap{margin-top:10px}.row{display:flex;gap:9px}.row>*{flex:1}
.btn{border:0;border-radius:12px;padding:13px;background:#2a3c2e;color:#fff;font-size:15px;font-weight:650}
.btn.primary{width:100%;padding:16px;background:var(--green);font-size:18px}
.btn.primary:disabled{opacity:.55}.btn.red{background:var(--red)}.btn.blue{background:var(--blue)}
.stats{display:flex;justify-content:space-between;gap:7px;color:var(--muted);font-size:12px;margin:7px 2px 0}
.coord{font-family:ui-monospace,monospace;color:#c5ebcb;font-size:14px}
.status{font-size:13px;color:var(--muted);min-height:19px;margin:8px 0 2px}
.bar{position:fixed;z-index:20;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 12px;background:#0a110c;border-top:1px solid var(--line)}
.bar .btn{flex:1}
.tiny{font-size:11px;color:var(--muted);line-height:1.35;margin:8px 0 0}
.hidden{display:none!important}
.modal{position:fixed;z-index:100;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:18px}
.modalbox{width:min(430px,100%);background:var(--card);border-radius:17px;padding:18px;border:1px solid var(--line)}
.modalbox h2{margin:0 0 7px;font-size:20px}.modalbox p{color:var(--muted);font-size:13px;margin:0 0 10px}
.modalbox .btn{width:100%}
.popup{position:absolute;background:#fff;color:#17251a;padding:7px 9px;border-radius:8px;border:1px solid #777;font-size:12px;min-width:150px;transform:translate(-50%,-115%)}
.pill{display:inline-block;padding:6px 10px;border-radius:20px;background:#263b2b;color:#cce6d1;font-size:12px;align-self:center}
.ol-attribution{font-size:9px}
.ol-scale-line{background:rgba(255,255,255,.75);border-radius:4px;bottom:22px;left:8px;padding:2px 4px}.ol-scale-line-inner{border:2px solid #1b2a1f;border-top:none;color:#1b2a1f;font-size:11px;font-weight:600}
details summary{cursor:pointer;font-size:14px;font-weight:650;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:'▸ ';color:var(--muted)}details[open] summary::before{content:'▾ '}
.sync{font-size:12px;color:var(--muted);margin-top:6px}
.cam{position:fixed;inset:0;z-index:200;background:#000;display:flex;flex-direction:column}
.cam video{flex:1;width:100%;object-fit:cover;background:#000}
.cam .ovl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cam .top{position:absolute;left:0;right:0;top:0;padding:10px 80px 10px 80px;background:linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,0));color:#fff}
.cam .rumb{font-size:30px;font-weight:800;letter-spacing:1px;text-align:center;line-height:1.1}
.cam .rumb small{display:block;font-size:14px;font-weight:600;opacity:.9}
.cam .hint{font-size:11px;opacity:.85;text-align:center;margin-top:4px}
.cam .rose{position:absolute;right:12px;top:12px;width:64px;height:64px}
.cam .bottom{position:absolute;left:0;right:0;bottom:0;padding:14px 16px 22px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.75))}
.cam .shutter{width:76px;height:76px;border-radius:50%;background:#fff;border:6px solid rgba(255,255,255,.45);box-shadow:0 0 0 2px #000 inset}
.cam .shutter:disabled{opacity:.4}
.cam .sbtn{border:0;border-radius:12px;padding:10px 14px;background:rgba(255,255,255,.18);color:#fff;font-size:14px;font-weight:650}
.cam .meta{position:absolute;left:12px;bottom:112px;color:#fff;font-size:12px;font-family:ui-monospace,monospace;text-shadow:0 0 4px #000}
</style>
</head>
<body>
<div id="observerModal" class="modal">
 <div class="modalbox">
  <h2 data-i18n="obs_title"></h2>
  <p data-i18n="obs_text"></p>
  <select id="observerSelect">
   <option value="" data-i18n="obs_select"></option><option>Kotlov</option><option>Yachmennikova</option><option>Rozhnov</option><option>Zhu</option><option>Aristarkhova</option><option>Rodnikova</option><option>Ogurtsov</option><option>Sandlersky</option><option value="__other__" data-i18n="obs_other"></option>
  </select>
  <input id="observerOther" class="gap hidden" data-i18n-ph="obs_other_ph">
  <button id="observerConfirm" class="btn primary gap" data-i18n="continue"></button>
 </div>
</div>

<div id="shareModal" class="modal hidden">
 <div class="modalbox">
  <h2 data-i18n="share_title"></h2>
  <p data-i18n="share_zip_blocked"></p>
  <button id="sharePoints" class="btn primary" data-i18n="share_csv"></button>
  <button id="sharePhotos" class="btn primary gap" data-i18n="share_photos"></button>
  <button id="shareCancel" class="btn gap" data-i18n="cancel"></button>
 </div>
</div>

<div id="qrModal" class="modal hidden">
 <div class="modalbox" style="text-align:center">
  <h2 data-i18n="qr_title"></h2>
  <p data-i18n="qr_text"></p>
  <div id="qrBox" style="background:#fff;padding:12px;border-radius:12px;display:inline-block"></div>
  <p id="qrLink" class="tiny" style="word-break:break-all"></p>
  <details id="syncDetails" style="text-align:left">
   <summary class="tiny" data-i18n="sync_title"></summary>
   <p class="tiny" data-i18n-html="sync_note"></p>
   <label class="gap" data-i18n="token_lbl"></label>
   <input id="ytoken" type="password" autocomplete="off" data-i18n-ph="token_ph">
   <div class="row gap"><button id="tokenGet" class="btn" data-i18n="token_get"></button><button id="tokenSave" class="btn" data-i18n="save"></button></div>
   <button id="syncNow" class="btn blue gap" style="width:100%" data-i18n="sync_now"></button>
   <p class="tiny" data-i18n="token_help"></p>
   <label class="gap" data-i18n="tdt_lbl"></label>
   <input id="tdtkey" autocomplete="off" data-i18n-ph="tdt_ph">
   <button id="tdtSave" class="btn gap" data-i18n="save"></button>
   <p class="tiny" data-i18n-html="tdt_help"></p>
  </details>
  <button id="qrClose" class="btn gap" data-i18n="close"></button>
 </div>
</div>

<div class="hdr">
 <img src="icon-192.png" alt="ИПЭЭ РАН">
 <div class="lab"><span data-i18n-html="lab_main"></span><small data-i18n="lab_sub"></small></div>
 <img id="labLogo" class="labph" src="lab-logo.png" alt="Лаборатория биогеоценологии" onerror="this.removeAttribute('src');this.style.visibility='hidden'">
</div>
<div class="titlerow"><button id="qrTop" class="langbtn qrtop" data-i18n-title="qr_btn" aria-label="QR">▦ QR</button><h1>Habitat 32</h1><button id="langBtn" class="langbtn" data-i18n="lang_btn"></button></div>
<div class="card" style="padding:7px">
 <div class="mapwrap">
  <div id="map"></div>
  <div class="mapbtns">
   <button id="zoomIn" class="mb" data-i18n-title="zoom_in">+</button>
   <button id="zoomOut" class="mb" data-i18n-title="zoom_out">−</button>
   <button id="centerMe" class="mb" data-i18n-title="center_me">⌖</button>
   <button id="baseToggle" class="mb small" data-i18n-title="basemap"></button>
  </div>
  <div id="baseMenu" class="basemenu hidden">
   <button data-bm="osm" data-i18n="bm_osm"></button>
   <button data-bm="sat" data-i18n="bm_sat"></button>
   <button data-bm="tdt_vec" data-i18n="bm_tdt_vec"></button>
   <button data-bm="tdt_img" data-i18n="bm_tdt_img"></button>
  </div>
  <div id="popup" class="popup hidden"></div>
 </div>
 <div class="stats"><span id="observerLabel">—</span><span id="dateLabel">—</span></div>
 <div class="stats"><span id="syncState">—</span><span id="tileState"></span></div>
</div>

<div class="card">
 <div class="row"><button id="trackToggle" class="btn blue"></button><button id="changeObserver" class="btn" data-i18n="observer_btn"></button></div>
 <div class="stats"><span id="trackStats">—</span><span id="gpsState">GPS: …</span></div>
</div>

<div class="card">
 <label data-i18n="class_lbl"></label><select id="category"></select>
 <label class="gap" data-i18n="desc_lbl"></label><input id="note" data-i18n-ph="desc_ph">
</div>

<div class="card">
 <div class="row"><div><label data-i18n="lat"></label><div id="lat" class="coord">—</div></div><div><label data-i18n="lon"></label><div id="lon" class="coord">—</div></div></div>
 <div id="status" class="status"></div>
 <button id="record" class="btn primary" data-i18n="record"></button>
</div>

<div class="card">
 <label data-i18n="photo_point_lbl"></label>
 <select id="photoPoint"></select>
 <button id="takePhoto" class="btn primary gap" disabled data-i18n="photo_btn"></button>
 <input id="photoFile" type="file" accept="image/*" capture="environment" class="hidden">
 <div class="stats"><span id="photoCount">—</span><span id="compassState">—</span></div>
 <p class="tiny" data-i18n="photo_note"></p>
</div>

<div class="card">
 <div class="row"><span id="pointCount" class="pill">—</span><button id="clearToday" class="btn red" data-i18n="clear_today"></button></div>
 <p class="tiny" data-i18n="points_note"></p>
</div>



<div id="camModal" class="cam hidden">
 <video id="camVideo" autoplay playsinline muted></video>
 <svg id="camOverlay" class="ovl"></svg>
 <div class="top">
  <div class="rumb" id="camRumb">—<small id="camRumbSub"></small></div>
  <div class="hint" data-i18n="cam_hint"></div>
 </div>
 <svg class="rose" id="camRose" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="rgba(0,0,0,.45)" stroke="#fff" stroke-width="2"/><g id="roseDial"><polygon points="50,8 44,50 56,50" fill="#e53935"/><polygon points="50,92 44,50 56,50" fill="#fff"/><text x="50" y="22" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">N</text></g><circle cx="50" cy="50" r="4" fill="#fff"/></svg>
 <div class="meta" id="camMeta"></div>
 <div class="bottom">
  <button id="camClose" class="sbtn" data-i18n="close"></button>
  <button id="camShutter" class="shutter"></button>
  <span style="width:70px"></span>
 </div>
</div>

<div class="footer"><span data-i18n="footer"></span> · <a href="https://github.com/ikotlov-ux/khingan-field-app" data-i18n="source"></a></div>

<div class="bar"><button id="share" class="btn primary" style="margin:0;padding:14px" data-i18n="share"></button></div>
<script src="i18n.js"></script><script src="classes.js"></script><script src="sync-core.js"></script><script src="app.js"></script>
</body>
</html>
